version: 2

models:
  # --- DIMENSIONES ---
  - name: dim_fecha
    description: "Grano: una fila por día calendario, enriquecida con mes, trimestre, día de semana y fase ENSO de NOAA."
    columns:
      - name: fecha_key
        data_tests: [unique, not_null]

  - name: dim_municipio
    description: "Grano: una fila por municipio de Antioquia, identificado por código DIVIPOLA."
    columns:
      - name: municipio_id
        data_tests: [unique, not_null]

  - name: dim_segmento
    description: "Grano: una fila por combinación de segmento de cliente y tipo de compra."
    columns:
      - name: segmento_id
        data_tests: [unique, not_null]

  - name: dim_mes
    description: "Grano: una fila por mes calendario presente en las ventas."
    columns:
      - name: mes_id
        data_tests: [unique, not_null]

  - name: dim_recurso
    description: "Grano: una fila por código de recurso XM; atributos provenientes de ListadoRecursos. Se incluyen recursos históricos de generación ausentes del catálogo con atributos descriptivos no informados."
    columns:
      - name: recurso_key
        data_tests: [unique, not_null]
      - name: codigo_recurso
        data_tests: [unique, not_null]

  - name: dim_fuente
    description: "Grano: una fila por fuente de datos del observatorio."
    columns:
      - name: fuente_key
        data_tests: [unique, not_null]

  # --- TABLAS DE HECHOS ---
  - name: fact_ventas_mensual
    description: "Grano: un registro por periodo (YYYY-MM), municipio, segmento de cliente y tipo de compra; incluye ventas desde 2023 hasta 2026 según la fuente disponible."
    columns:
      - name: mes_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_mes')
                field: mes_id
      - name: municipio_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: municipio_id
      - name: segmento_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segmento')
                field: segmento_id
      - name: tipo_compra
        data_tests:
          - accepted_values:
              arguments:
                values: ["Bolsa", "Contrato"]

  - name: fact_mercado_horario
    description: "Grano: un registro por fecha y hora, con precio de bolsa y demanda total horaria del sistema."
    columns:
      - name: fecha_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key

  - name: fact_generacion_recurso
    description: "Grano: un registro por fecha, hora y planta (código de recurso), con la generación XM medida en MWh."
    columns:
      - name: fecha_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: recurso_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recurso')
                field: recurso_key